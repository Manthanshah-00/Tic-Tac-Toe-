<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe — Liquid Glass</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Ambient light blobs -->
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>

  <!-- Specular light sweep -->
  <div class="light-sweep"></div>

  <div class="glass-panel">
    <!-- Prismatic edge highlight -->
    <div class="prism-edge"></div>

    <h1 class="title">Tic Tac Toe</h1>

    <div class="scoreboard">
      <div class="score-pill x-pill">
        <span class="pill-icon">✕</span>
        <span class="pill-val" id="score-x">0</span>
      </div>
      <div class="score-pill draw-pill">
        <span class="pill-icon">⟡</span>
        <span class="pill-val" id="score-draw">0</span>
      </div>
      <div class="score-pill o-pill">
        <span class="pill-icon">◯</span>
        <span class="pill-val" id="score-o">0</span>
      </div>
    </div>

    <p class="status" id="status">Player <span class="x-mark">✕</span>'s turn</p>

    <div class="board" id="board">
      <div class="cell" data-index="0"><span class="cell-inner"></span></div>
      <div class="cell" data-index="1"><span class="cell-inner"></span></div>
      <div class="cell" data-index="2"><span class="cell-inner"></span></div>
      <div class="cell" data-index="3"><span class="cell-inner"></span></div>
      <div class="cell" data-index="4"><span class="cell-inner"></span></div>
      <div class="cell" data-index="5"><span class="cell-inner"></span></div>
      <div class="cell" data-index="6"><span class="cell-inner"></span></div>
      <div class="cell" data-index="7"><span class="cell-inner"></span></div>
      <div class="cell" data-index="8"><span class="cell-inner"></span></div>
    </div>

    <button class="btn-glass" id="restart">New Round</button>
  </div>

  <script src="script.js"></script>
</body>
